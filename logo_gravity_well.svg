<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#0E1013;">
  <defs>
    <style>
      .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #8C939D; letter-spacing: 0.12em; text-transform: uppercase; }
      .title { font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 300; fill: #F3F1EC; letter-spacing: 0.05em; }
      .grid-line { stroke: #C7CDD6; stroke-opacity: 0.15; stroke-dasharray: 2 4; }
      .dim-line { stroke: #D6C3A3; stroke-opacity: 0.5; stroke-width: 1; }
      .wordmark { font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 500; fill: #F3F1EC; letter-spacing: 0.22em; }
      .wordmark-dark { font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 500; fill: #0E1013; letter-spacing: 0.22em; }
    </style>
  </defs>

  <!-- Title & Specs -->
  <text x="50" y="45" class="title">BASX — Brand Identity Specification</text>
  <text x="50" y="70" class="label">CONCEPT: GRAVITY WELL / FIELD GRADIENT</text>

  <!-- PANEL 1: SYMBOL CONSTRUCTION GRID (ON DARK #0E1013) -->
  <g transform="translate(50, 110)">
    <!-- Box background -->
    <rect x="0" y="0" width="420" height="420" fill="#171A1F" stroke="rgba(199,205,214,0.12)" stroke-width="1"/>
    <text x="20" y="30" class="label">01 · SYMBOL CONSTRUCTION GRID</text>

    <g transform="translate(210, 230)">
      <!-- Construction Circles -->
      <circle cx="0" cy="0" r="140" fill="none" class="grid-line" />
      <circle cx="0" cy="0" r="100" fill="none" class="grid-line" />
      <circle cx="0" cy="0" r="60" fill="none" class="grid-line" />
      <line x1="-160" y1="0" x2="160" y2="0" class="grid-line" />
      <line x1="0" y1="-160" x2="0" y2="160" class="grid-line" />

      <!-- Center Core Dot -->
      <circle cx="0" cy="0" r="18" fill="#F3F1EC" />

      <!-- Concentric Interrupted Arcs -->
      <!-- Inner Ring -->
      <path d="M -40,-45 A 60,60 0 0,1 40,-45" fill="none" stroke="#F3F1EC" stroke-width="6" stroke-linecap="round" />
      <path d="M 45,-40 A 60,60 0 0,1 45,40" fill="none" stroke="#F3F1EC" stroke-width="6" stroke-linecap="round" />
      <path d="M 40,45 A 60,60 0 0,1 -40,45" fill="none" stroke="#F3F1EC" stroke-width="6" stroke-linecap="round" />
      <path d="M -45,40 A 60,60 0 0,1 -45,-40" fill="none" stroke="#F3F1EC" stroke-width="6" stroke-linecap="round" />

      <!-- Outer Ring -->
      <path d="M -75,-80 A 110,110 0 0,1 75,-80" fill="none" stroke="#F3F1EC" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" />
      <path d="M 80,-75 A 110,110 0 0,1 80,75" fill="none" stroke="#F3F1EC" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" />
      <path d="M 75,80 A 110,110 0 0,1 -75,80" fill="none" stroke="#F3F1EC" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" />
      <path d="M -80,75 A 110,110 0 0,1 -80,-75" fill="none" stroke="#F3F1EC" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- PANEL 2: HORIZONTAL LOCKUP (DARK & LIGHT) -->
  <g transform="translate(510, 110)">
    <!-- Dark Lockup Box -->
    <rect x="0" y="0" width="440" height="200" fill="#171A1F" stroke="rgba(199,205,214,0.12)" stroke-width="1"/>
    <text x="20" y="30" class="label">02 · HORIZONTAL LOCKUP (MONOCHROME DARK #0E1013)</text>
    
    <g transform="translate(40, 115)">
      <!-- Symbol -->
      <circle cx="0" cy="0" r="6" fill="#F3F1EC" />
      <path d="M -12,-14 A 18,18 0 0,1 12,-14" fill="none" stroke="#F3F1EC" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 14,-12 A 18,18 0 0,1 14,12" fill="none" stroke="#F3F1EC" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 12,14 A 18,18 0 0,1 -12,14" fill="none" stroke="#F3F1EC" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -14,12 A 18,18 0 0,1 -14,-12" fill="none" stroke="#F3F1EC" stroke-width="2.5" stroke-linecap="round" />

      <!-- Wordmark -->
      <text x="45" y="8" class="wordmark">BASX</text>
    </g>

    <!-- Light Lockup Box -->
    <rect x="0" y="220" width="440" height="200" fill="#F3F1EC" stroke="rgba(199,205,214,0.12)" stroke-width="1"/>
    <text x="20" y="250" class="label" style="fill:#8C939D;">03 · HORIZONTAL LOCKUP (MONOCHROME LIGHT #F3F1EC)</text>

    <g transform="translate(40, 335)">
      <!-- Symbol -->
      <circle cx="0" cy="0" r="6" fill="#0E1013" />
      <path d="M -12,-14 A 18,18 0 0,1 12,-14" fill="none" stroke="#0E1013" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 14,-12 A 18,18 0 0,1 14,12" fill="none" stroke="#0E1013" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 12,14 A 18,18 0 0,1 -12,14" fill="none" stroke="#0E1013" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -14,12 A 18,18 0 0,1 -14,-12" fill="none" stroke="#0E1013" stroke-width="2.5" stroke-linecap="round" />

      <!-- Wordmark -->
      <text x="45" y="8" class="wordmark-dark">KILOVIN</text>
    </g>
  </g>
</svg>
